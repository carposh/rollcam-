<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rollcam">
  <meta name="theme-color" content="#141312">
  <meta name="description" content="A disposable camera. Shoot the roll, send it to the lab, wait.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Rollcam</title>
</head>
<body>
  <main id="camera">
    <header class="topbar">
      <button id="btn-lab" class="pill" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v13H3zM3 7l2-3h14l2 3M9 11h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        Lab<span id="lab-badge" class="badge" hidden></span>
      </button>
      <span class="grow"></span>
      <button id="btn-early" class="icon" type="button" aria-label="Develop early" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
      <button id="btn-settings" class="icon" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8-3.5-.1-1.3 2-1.6-2-3.4-2.4.9a8 8 0 0 0-2.2-1.3L15 3h-4l-.4 2.5a8 8 0 0 0-2.2 1.3L6 5.9 4 9.3l2 1.6a8 8 0 0 0 0 2.6l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 2.2 1.3L11 21h4l.4-2.5a8 8 0 0 0 2.2-1.3l2.4.9 2-3.4-2-1.6.1-1.3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="plate">
      <div class="col">
        <div class="finder" id="finder">
          <video id="video" playsinline muted autoplay></video>
          <div class="brightline"></div>
          <div class="glare"></div>
          <div class="finder-msg" id="finder-msg" hidden></div>
          <div class="curtain" id="curtain"></div>
        </div>
        <span class="engrave">VIEWFINDER</span>
      </div>
      <span class="grow"></span>
      <div class="col">
        <div class="counter" id="counter" aria-live="polite">–</div>
        <span class="engrave">EXP.</span>
      </div>
      <div class="wheel" id="wheel" role="slider" aria-label="Film advance wheel" tabindex="0">
        <div class="ridges" id="ridges"></div>
        <div class="wheel-shade"></div>
        <div class="wheel-meter" id="wheel-meter"></div>
      </div>
    </section>

    <div class="wrapper">
      <b>ROLLCAM</b>
      <span id="wrap-exp">NO FILM</span>
      <span class="grow"></span>
      <span id="wrap-status">ISO 400</span>
    </div>

    <div class="controls">
      <button id="btn-flash" class="pill" type="button">
        <i class="led"></i>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg>
        <span id="flash-label">FLASH OFF</span>
      </button>
      <span class="grow"></span>
      <button id="btn-flip" class="icon round" type="button" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12.5a3 3 0 0 1 5.2-2M15 13.5a3 3 0 0 1-5.2 2M14.5 8.8v2h-2M9.5 17.2v-2h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="action">
      <button id="btn-load" class="big yellow" type="button" hidden>Load film</button>
      <button id="btn-send" class="big orange" type="button" hidden>Send to lab</button>
      <button id="btn-shutter" class="shutter" type="button" aria-label="Shutter" hidden><span></span></button>
    </div>
  </main>

  <div id="screenflash" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">Rollcam needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
