name: Rollcam
options:
  bundleIdPrefix: com.ran
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Rollcam:
    type: application
    platform: iOS
    sources:
      - path: Rollcam
    settings:
      base:
        PRODUCT_NAME: Rollcam
        PRODUCT_BUNDLE_IDENTIFIER: com.ran.rollcam
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  Rollcam:
    build:
      targets:
        Rollcam: all
    run:
      config: Debug
    archive:
      config: Release
